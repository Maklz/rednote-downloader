<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отбор видео — ПУЛЬСАР</title>
<link rel="icon" href="/icon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f7;
    --card: #ffffff;
    --ink: #1a1a1c;
    --muted: #6b6b73;
    --line: #e2e2e6;
    --accent: #2f6fed;
    --danger: #c2372c;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f25;
      --ink: #ececf0;
      --muted: #9a9aa4;
      --line: #32323a;
      --accent: #6c9bff;
      --danger: #ef6a5e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { max-width: 900px; margin: 0 auto 20px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); font-size: 14px; }

  main { max-width: 900px; margin: 0 auto; display: grid; gap: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display: grid;
    grid-template-columns: 168px 1fr;
    gap: 14px;
  }

  @media (max-width: 620px) {
    .card { grid-template-columns: 1fr; }
  }

  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 8px;
    background: var(--line);
  }

  .title { font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .meta a { color: inherit; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  input[type="text"] {
    flex: 1 1 240px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }

  button {
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled { opacity: .5; cursor: default; }
  .publish { background: var(--accent); color: #fff; }
  .reject { background: transparent; color: var(--danger); border-color: var(--line); }

  .status { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent); }

  .empty, .warn {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    color: var(--muted);
    text-align: center;
  }

  .warn { color: var(--danger); text-align: left; }

  .history { max-width: 900px; margin: 28px auto 0; }
  .history h2 { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .history li { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
</style>
</head>
<body>
  <header>
    <h1>Отбор видео</h1>
    <div class="sub" id="summary">Загрузка…</div>
  </header>

  <main id="list"></main>

  <section class="history" id="history" hidden>
    <h2>Недавние решения</h2>
    <ul id="historyList"></ul>
  </section>

  <script src="/review.js" type="module"></script>
</body>
</html>
